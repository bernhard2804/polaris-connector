# Einstiege der Agenten ins Maschinengedächtnis.
# Format: <Pfad>  <Ziel relativ zu ~/.config/ai-agents>  # Agent, Beleg
# Jeder Pfad ist ein Symlink auf das Ziel. memlint.py prüft nur Einträge,
# deren Ordner existiert (Agent eingerichtet); `memlint.py --link` legt
# fehlende an, ersetzt aber nie eine vorhandene Datei. Neuer Agent: Zeile
# ergänzen, nachdem belegt ist, welche globale Datei er liest.
# Skills: Jeder Ordner unter skills/<name>/ wird in die Skill-Ordner der
# Agenten verlinkt (~/.agents/skills – liest auch Gemini CLI –, ~/.claude/skills,
# ~/.codex/skills). Eigene Liste statt dieser: Zeilen `<Ordner>/  skills/`.
~/.claude/CLAUDE.md                  AGENTS.md      # Claude Code
~/.codex/AGENTS.md                   AGENTS.md      # Codex CLI
~/.gemini/GEMINI.md                  AGENTS.md      # Gemini CLI, Antigravity
~/.config/opencode/AGENTS.md         AGENTS.md      # opencode
~/.copilot/copilot-instructions.md   AGENTS.md      # GitHub Copilot CLI
~/.grok/AGENTS.md                    AGENTS.md      # Grok CLI
~/.config/AGENTS.md                  AGENTS.md      # Crush und andere AGENTS.md-Leser
