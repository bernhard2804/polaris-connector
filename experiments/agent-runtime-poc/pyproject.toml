[project]
name = "polaris-agent-runtime-poc"
version = "0.1.0"
description = "Isolated, reversible agent-runtime proof of concept for Polaris"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-sdk==1.38.0",
  "pydantic-ai-harness==0.32.0",
  "pydantic-ai-slim[anthropic,mcp,openai]==2.46.0",
]

[project.scripts]
polaris-agent-poc = "polaris_agent_poc.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_agent_poc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
